<text class="sub" x="195" y="254" text-anchor="middle">Blue</text>
<text class="lbl" x="195" y="284" text-anchor="middle">4</text>
<rect x="260" y="84" width="106" height="216" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<g transform="translate(296 118)"><circle r="14" fill="#93c5fd"/><circle r="14" fill="#ef4444" clip-path="url(#lh)"/><circle r="14" fill="none" stroke="#1e1b4b" stroke-width="1.5"/><circle cx="-4" cy="-4" r="2" fill="#1e1b4b"/><circle cx="4" cy="-4" r="2" fill="#1e1b4b"/><circle cx="-4" cy="4" r="2" fill="#1e1b4b"/><circle cx="4" cy="4" r="2" fill="#1e1b4b"/></g>
<g transform="translate(330 118)"><circle r="14" fill="#93c5fd"/><circle r="14" fill="#ef4444" clip-path="url(#lh)"/><circle r="14" fill="none" stroke="#1e1b4b" stroke-width="1.5"/><circle cx="-4" cy="-4" r="2" fill="#1e1b4b"/><circle cx="4" cy="-4" r="2" fill="#1e1b4b"/><circle cx="-4" cy="4" r="2" fill="#1e1b4b"/><circle cx="4" cy="4" r="2" fill="#1e1b4b"/></g>
<text class="sub" x="313" y="254" text-anchor="middle">Two colors</text>
<text class="lbl" x="313" y="284" text-anchor="middle">2</text>
<rect x="410" y="84" width="286" height="216" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text class="lbl" x="426" y="112">Picture graph</text>
<text class="sub" x="426" y="148">Red</text>
<rect x="530" y="128" width="28" height="28" rx="4" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
<rect x="562" y="128" width="28" height="28" rx="4" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
