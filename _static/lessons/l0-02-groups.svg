<g transform="translate(178 152)"><circle r="14" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/><circle cx="-4" cy="-4" r="2" fill="#1e40af"/><circle cx="4" cy="-4" r="2" fill="#1e40af"/><circle cx="-4" cy="4" r="2" fill="#1e40af"/><circle cx="4" cy="4" r="2" fill="#1e40af"/></g>
