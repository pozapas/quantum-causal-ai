<rect x="658" y="128" width="28" height="28" rx="4" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
<text class="sub" x="426" y="192">Blue</text>
<rect x="530" y="172" width="28" height="28" rx="4" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
<rect x="562" y="172" width="28" height="28" rx="4" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
<rect x="594" y="172" width="28" height="28" rx="4" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
<rect x="626" y="172" width="28" height="28" rx="4" fill="#93c5fd" stroke="#1e40af" stroke-width="1.5"/>
<text class="sub" x="426" y="236">Two colors</text>
<path d="M544 216 H534 a4 4 0 0 0 -4 4 V240 a4 4 0 0 0 4 4 H544 Z" fill="#ef4444"/><path d="M544 216 H554 a4 4 0 0 1 4 4 V240 a4 4 0 0 1 -4 4 H544 Z" fill="#93c5fd"/><rect x="530" y="216" width="28" height="28" rx="4" fill="none" stroke="#1e1b4b" stroke-width="1.5"/>
<path d="M576 216 H566 a4 4 0 0 0 -4 4 V240 a4 4 0 0 0 4 4 H576 Z" fill="#ef4444"/><path d="M576 216 H586 a4 4 0 0 1 4 4 V240 a4 4 0 0 1 -4 4 H576 Z" fill="#93c5fd"/><rect x="562" y="216" width="28" height="28" rx="4" fill="none" stroke="#1e1b4b" stroke-width="1.5"/>
<line x1="522" y1="122" x2="522" y2="250" stroke="#94a3b8" stroke-width="2"/>
<text class="sub" x="426" y="284">1 square = 1 button</text>
<text class="lbl" x="696" y="336" text-anchor="end" style="fill:#6d28d9">Red has the most.</text>
</svg>
