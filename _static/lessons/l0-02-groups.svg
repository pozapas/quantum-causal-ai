<g transform="translate(60 152)"><circle r="14" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/><circle cx="-4" cy="-4" r="2" fill="#7f1d1d"/><circle cx="4" cy="-4" r="2" fill="#7f1d1d"/><circle cx="-4" cy="4" r="2" fill="#7f1d1d"/><circle cx="4" cy="4" r="2" fill="#7f1d1d"/></g>
<g transform="translate(94 152)"><circle r="14" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/><circle cx="-4" cy="-4" r="2" fill="#7f1d1d"/><circle cx="4" cy="-4" r="2" fill="#7f1d1d"/><circle cx="-4" cy="4" r="2" fill="#7f1d1d"/><circle cx="4" cy="4" r="2" fill="#7f1d1d"/></g>
<g transform="translate(77 186)"><circle r="14" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/><circle cx="-4" cy="-4" r="2" fill="#7f1d1d"/><circle cx="4" cy="-4" r="2" fill="#7f1d1d"/><circle cx="-4" cy="4" r="2" fill="#7f1d1d"/><circle cx="4" cy="4" r="2" fill="#7f1d1d"/></g>
<text class="sub" x="77" y="254" text-anchor="middle">Red</text>
