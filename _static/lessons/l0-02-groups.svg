<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">Sort by color, then graph</title>
<desc id="d">Rule: sort by color. Tricky buttons with two colors get their own group. Buttons are sorted into three groups on mats. The red group has 5 buttons. The blue group has 4 buttons. The two colors group has 2 buttons that are half red and half blue. On the right is a picture graph with one row for each group and one square for each button: red has 5 squares, blue has 4, and two colors has 2. One square stands for one button. The red row is the longest, so red has the most.</desc>
<defs>
  <style>
    .lbl{font:700 18px Inter,"Segoe UI",Arial,sans-serif;fill:#1e1b4b}
    .sub{font:500 16px Inter,"Segoe UI",Arial,sans-serif;fill:#475569}
    .big{font:700 28px Inter,"Segoe UI",Arial,sans-serif;fill:#1e1b4b}
    .tally{stroke:#1e1b4b;stroke-width:4;stroke-linecap:round}
    .slash{stroke:#7c3aed;stroke-width:4;stroke-linecap:round}
  </style>
<clipPath id="lh"><rect x="-15" y="-15" width="15" height="30"/></clipPath>
</defs>
<rect width="720" height="360" rx="18" fill="#ffffff"/>
<text class="lbl" x="24" y="40">Rule: sort by color</text>
<text class="sub" x="24" y="64">Tricky buttons with two colors get their own group.</text>
<rect x="24" y="84" width="106" height="216" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<g transform="translate(60 118)"><circle r="14" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/><circle cx="-4" cy="-4" r="2" fill="#7f1d1d"/><circle cx="4" cy="-4" r="2" fill="#7f1d1d"/><circle cx="-4" cy="4" r="2" fill="#7f1d1d"/><circle cx="4" cy="4" r="2" fill="#7f1d1d"/></g>
