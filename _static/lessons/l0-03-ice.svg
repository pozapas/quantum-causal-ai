<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">Watching an ice cube melt</title>
<desc id="d">An ice cube on a plate, drawn at 0, 5, 10, and 15 minutes. At 0 minutes the cube is big and the plate is dry. At each later time the cube is smaller and rounder and the blue puddle around it is bigger. At 15 minutes a smaller cube is still there in a bigger puddle. Below is a chart with two columns. The I saw column says: the cube got smaller, and more water on the plate. The I think it is because column says: the room is warm, and the plate is warm, each with a question mark. These are ideas to test later.</desc>
<defs>
  <style>
    .lbl{font:700 18px Inter,"Segoe UI",Arial,sans-serif;fill:#1e1b4b}
    .sub{font:500 16px Inter,"Segoe UI",Arial,sans-serif;fill:#475569}
    .big{font:700 28px Inter,"Segoe UI",Arial,sans-serif;fill:#1e1b4b}
    .tally{stroke:#1e1b4b;stroke-width:4;stroke-linecap:round}
    .slash{stroke:#7c3aed;stroke-width:4;stroke-linecap:round}
  </style>
</defs>
<rect width="720" height="360" rx="18" fill="#ffffff"/>
<text class="lbl" x="102" y="40" text-anchor="middle">0 min</text>
<ellipse cx="102" cy="118" rx="74" ry="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<ellipse cx="102" cy="118" rx="54" ry="20" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="80" y="74" width="44" height="44" rx="4" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
<line x1="86" y1="81" x2="99" y2="81" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text class="lbl" x="274" y="40" text-anchor="middle">5 min</text>
<ellipse cx="274" cy="118" rx="74" ry="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<ellipse cx="274" cy="118" rx="54" ry="20" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<ellipse cx="274" cy="118" rx="28" ry="9" fill="#93c5fd" opacity="0.85"/>
<rect x="254" y="78" width="40" height="40" rx="6" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
<line x1="260" y1="85" x2="272" y2="85" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text class="lbl" x="446" y="40" text-anchor="middle">10 min</text>
<ellipse cx="446" cy="118" rx="74" ry="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<ellipse cx="446" cy="118" rx="54" ry="20" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<ellipse cx="446" cy="118" rx="36" ry="12" fill="#93c5fd" opacity="0.85"/>
<rect x="428" y="82" width="36" height="36" rx="7" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
<line x1="434" y1="89" x2="445" y2="89" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text class="lbl" x="618" y="40" text-anchor="middle">15 min</text>
<ellipse cx="618" cy="118" rx="74" ry="30" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<ellipse cx="618" cy="118" rx="54" ry="20" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
<ellipse cx="618" cy="118" rx="44" ry="15" fill="#93c5fd" opacity="0.85"/>
<rect x="602" y="86" width="32" height="32" rx="9" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/>
<line x1="608" y1="93" x2="618" y2="93" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<path d="M180 118 h8" stroke="#a78bfa" stroke-width="3"/><path d="M196 118 l-9 -6 v12 z" fill="#a78bfa"/>
<path d="M352 118 h8" stroke="#a78bfa" stroke-width="3"/><path d="M368 118 l-9 -6 v12 z" fill="#a78bfa"/>
<path d="M524 118 h8" stroke="#a78bfa" stroke-width="3"/><path d="M540 118 l-9 -6 v12 z" fill="#a78bfa"/>
