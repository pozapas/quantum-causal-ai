<line x1="360" y1="170" x2="360" y2="340" stroke="#e2e8f0" stroke-width="2"/>
<text class="lbl" x="44" y="199">I saw</text><text class="lbl" x="380" y="199" style="fill:#6d28d9">I think it is because</text>
<text class="sub" x="44" y="252">The cube got smaller.</text><text class="sub" x="44" y="292">More water on the plate.</text>
<text class="sub" x="380" y="252">The room is warm?</text><text class="sub" x="380" y="292">The plate is warm?</text>
<text class="sub" x="676" y="326" text-anchor="end" font-style="italic">Ideas to test later</text>
</svg>
