<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">Three big ideas</title>
<desc id="d">Three circles that overlap. The top left circle is Causes and holds the note fair test. The top right circle is Tiny things and holds the note surprising rules. The bottom circle is Learning machines and holds the note patterns. Where all three circles meet are the words this course. Numbers mark the places where two circles overlap, and a box on the right explains them. Number 1, where Causes and Tiny things overlap: measuring tiny things can change them. Number 2, where Causes and Learning machines overlap: a pattern is not always a cause. Number 3, where Tiny things and Learning machines overlap: computers use bits, and quantum bits come later.</desc>
<defs>
  <style>
    .lbl{font:700 18px Inter,"Segoe UI",Arial,sans-serif;fill:#1e1b4b}
    .sub{font:500 16px Inter,"Segoe UI",Arial,sans-serif;fill:#475569}
    .ex{font:600 16px Inter,"Segoe UI",Arial,sans-serif;fill:#1e1b4b}
    .num{font:700 16px Inter,"Segoe UI",Arial,sans-serif;fill:#ffffff}
  </style>
</defs>
<rect width="720" height="360" rx="18" fill="#ffffff"/>

<!-- circles -->
<circle cx="205" cy="135" r="95" fill="#a78bfa" fill-opacity="0.28" stroke="#7c3aed" stroke-width="3"/>
<circle cx="325" cy="135" r="95" fill="#06b6d4" fill-opacity="0.2" stroke="#0891b2" stroke-width="3"/>
<circle cx="265" cy="239" r="95" fill="#fcd34d" fill-opacity="0.4" stroke="#d97706" stroke-width="3"/>

<!-- circle names -->
<text class="lbl" x="200" y="28" text-anchor="middle" style="fill:#6d28d9">Causes</text>
<text class="lbl" x="330" y="28" text-anchor="middle" style="fill:#0e7490">Tiny things</text>
<text class="lbl" x="196" y="326" text-anchor="end" style="fill:#92400e">Learning machines</text>

<!-- single-circle examples -->
<text class="ex" x="152" y="124" text-anchor="middle">fair test</text>
<text class="ex" x="380" y="116" text-anchor="middle">surprising</text>
<text class="ex" x="380" y="136" text-anchor="middle">rules</text>
<text class="ex" x="265" y="300" text-anchor="middle">patterns</text>

<!-- overlap markers -->
<circle cx="265" cy="84" r="13" fill="#7c3aed"/><text class="num" x="265" y="90" text-anchor="middle">1</text>
<circle cx="208" cy="208" r="13" fill="#7c3aed"/><text class="num" x="208" y="214" text-anchor="middle">2</text>
<circle cx="322" cy="208" r="13" fill="#7c3aed"/><text class="num" x="322" y="214" text-anchor="middle">3</text>

<!-- center -->
<rect x="213" y="149" width="104" height="28" rx="14" fill="#ffffff" stroke="#1e1b4b" stroke-width="2"/>
<text class="lbl" x="265" y="169" text-anchor="middle" style="font-size:16px">this course</text>

<!-- explanation box -->
<g transform="translate(456 48)">
  <rect x="0" y="0" width="244" height="270" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="lbl" x="16" y="32">Where circles meet</text>
  <circle cx="29" cy="66" r="13" fill="#7c3aed"/><text class="num" x="29" y="72" text-anchor="middle">1</text>
  <text class="sub" x="52" y="72">Measuring tiny things</text>
  <text class="sub" x="52" y="94">can change them.</text>
  <circle cx="29" cy="136" r="13" fill="#7c3aed"/><text class="num" x="29" y="142" text-anchor="middle">2</text>
  <text class="sub" x="52" y="142">A pattern is not</text>
  <text class="sub" x="52" y="164">always a cause.</text>
  <circle cx="29" cy="206" r="13" fill="#7c3aed"/><text class="num" x="29" y="212" text-anchor="middle">3</text>
  <text class="sub" x="52" y="212">Computers use bits.</text>
  <text class="sub" x="52" y="234">Quantum bits</text>
  <text class="sub" x="52" y="256">come later.</text>
</g>
</svg>
