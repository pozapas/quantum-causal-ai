<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
<title id="t">Count and tally two piles</title>
<desc id="d">Two piles of buttons. Pile A has 12 buttons. Under it are 12 tally marks: two groups of five, each with a line across, and 2 more lines. The count says 12. Pile B has 9 buttons. Under it are 9 tally marks: one group of five and 4 more lines. The count says 9. A violet arrow between the piles points to Pile A with the word more, because 12 is more than 9. At the bottom it says: touch it, move it, say the number. Each button once.</desc>
